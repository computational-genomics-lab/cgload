name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # nightly, for the slow real-genome tier

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --output-format=github .

  test:
    name: tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # One non-Linux job: a reviewer on a Mac must not be the first
          # person to discover a path-separator assumption.
          - python-version: "3.12"
            os: macos-latest
          # The 'OS Independent' classifier in pyproject.toml is a claim; this
          # job is what makes it one we can defend.
          - python-version: "3.12"
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Entry point runs
        run: |
          cgload --version
          cgload --help
      - name: Test suite
        run: pytest --cov=cgload --cov-report=term-missing -m "not slow and not requires_server"

  build:
    name: package builds and installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel in a fresh environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/cgload --version

  slow:
    name: real-genome tier
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - name: Ground-truth genomes (tier 4/5)
        run: pytest -m slow -v
