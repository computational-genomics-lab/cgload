<div class="forms">
  <form action="{{ url_for('search_page', assembly_id=genome.assembly_id) }}" method="get" role="search">
    <input type="search" name="q" maxlength="{{ max_query }}" value="{{ query|default('') }}" placeholder="Gene, protein, product word, GO:…, K…, PF…" aria-label="Search this genome">
    <button type="submit">Search</button>
  </form>
  <form action="{{ url_for('region_page', assembly_id=genome.assembly_id) }}" method="get">
    <input type="text" name="r" maxlength="300" value="{{ region_text|default('') }}" placeholder="chr:start-end" aria-label="Region">
    <button type="submit">Browse region</button>
  </form>
</div>
